<text x="600.0" y="357" text-anchor="middle" class="title">Canonical quinolone audit</text>
<text x="600.0" y="385" text-anchor="middle" class="sub">Acquired determinants and recognised QRDR mutations reviewed; no explanatory</text>
<text x="600.0" y="417" text-anchor="middle" class="sub">candidate retained</text>
<line class="arrow" x1="600.0" y1="463" x2="600.0" y2="508" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="520" rx="22" ry="22" width="960" height="150"/>
<text x="600.0" y="572" text-anchor="middle" class="title">Comparator-aware sequence audit</text>
<text x="600.0" y="600" text-anchor="middle" class="sub">13 coding proteins, five noncoding units and eight proximal structural</text>
<text x="600.0" y="632" text-anchor="middle" class="sub">contexts</text>
<line class="arrow" x1="600.0" y1="678" x2="600.0" y2="723" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="735" rx="22" ry="22" width="960" height="150"/>
<text x="600.0" y="787" text-anchor="middle" class="title">Raw-read residual audit</text>
<text x="600.0" y="815" text-anchor="middle" class="sub">Copy number, 42-object minor-allele screen and acquired-quinolone family</text>
<text x="600.0" y="847" text-anchor="middle" class="sub">interrogation</text>
<line class="arrow" x1="600.0" y1="893" x2="600.0" y2="938" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="950" rx="22" ry="22" width="960" height="150"/>
<text x="600.0" y="1002" text-anchor="middle" class="title">Frozen residual inventory</text>
<text x="600.0" y="1030" text-anchor="middle" class="sub">Five sequence-level items: four ompF-region substitutions and one qnrB</text>
<text x="600.0" y="1062" text-anchor="middle" class="sub">raw-read locus</text>
<line class="arrow" x1="600.0" y1="1108" x2="600.0" y2="1153" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="1165" rx="22" ry="22" width="960" height="150"/>
<text x="600.0" y="1217" text-anchor="middle" class="title">External contextualisation</text>
<text x="600.0" y="1245" text-anchor="middle" class="sub">ompF: 0/5 exact ID005-site recurrence; qnrB: 0/2 signal; technical missingness</text>
<text x="600.0" y="1277" text-anchor="middle" class="sub">preserved</text>
<line class="arrow" x1="600.0" y1="1323" x2="600.0" y2="1368" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="1380" rx="22" ry="22" width="960" height="150"/>
<text x="600.0" y="1432" text-anchor="middle" class="title">Bounded endpoint</text>
