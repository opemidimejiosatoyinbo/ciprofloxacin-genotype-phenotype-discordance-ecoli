<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:24px}.arrow{stroke:#374151;stroke-width:5;fill:none}.box{fill:#F8FAFC;stroke:#4B5563;stroke-width:3}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker></defs>
<rect class="box" x="120" y="90" rx="22" ry="22" width="960" height="150"/>
<text x="600.0" y="142" text-anchor="middle" class="title">Phenotypic discordance</text>
<text x="600.0" y="170" text-anchor="middle" class="sub">ID005: ciprofloxacin resistant without an adequate canonical genomic</text>
<text x="600.0" y="202" text-anchor="middle" class="sub">explanation</text>
<line class="arrow" x1="600.0" y1="248" x2="600.0" y2="293" marker-end="url(#arrow)"/>
